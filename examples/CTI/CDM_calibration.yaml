# ########################################################### #
# Pyxel detector simulation framework                         #
#                                                             #
# Example yaml configuration file                             #
# Calibrate CDM CTI model with target image                   #
# Created by D. Lucsanyi (ESA)                                #
# ########################################################### #

simulation:

  mode: single
#  mode: calibration

  calibration:
    calibration_mode:     pipeline
    result_type:          image
    result_fit_range:     [10, 30, 20, 50]
    target_data_path:     ['data/results.fits']
    target_fit_range:     [10, 30, 20, 50]
    seed:                 4321
    fitness_function:
      func:               pyxel.calibration.fitness.sum_of_abs_residuals
      arguments:
    algorithm:
      type:               sade
      generations:        5
      population_size:    10
      variant:            2
    parameters:
#      - key:              pipeline.charge_transfer.cdm.arguments.tr_p
#        values:           [_, _, _, _]
#        logarithmic:      true
#        boundaries:       [1.e-3, 2.]
#      - key:              pipeline.charge_transfer.cdm.arguments.nt_p
#        values:           [_, _, _, _]
#        logarithmic:      true
#        boundaries:       [1.e-2, 1.e+1]
      - key:              pipeline.charge_transfer.cdm.arguments.beta_p
        values:           _
        logarithmic:      false
        boundaries:       [0., 1.]

  outputs:
    output_folder:  'examples/CTI/outputs'
    calibration_plot:
      champions_plot:
#        plot_args:
      population_plot:
#        columns: [16, 2]
#        plot_args:

detector:
  class: pyxel.detectors.ccd.CCD

  geometry:
    class: pyxel.detectors.ccd_geometry.CCDGeometry

    row:   100                  # pixels
    col:   100                  # pixels
    total_thickness: 40.        # um
    pixel_vert_size: 10.        # um
    pixel_horz_size: 10.        # um

  material:
    class: pyxel.detectors.material.Material
    material: 'silicon'

  environment:
    class: pyxel.detectors.environment.Environment

  characteristics:
    class: pyxel.detectors.ccd_characteristics.CCDCharacteristics
    qe: 0.5                 # -
    eta: 1.                 # e/photon
    sv: 1.0e-6              # V/e
    amp: 0.8                # V/V
    a1: 100.                # V/V
    a2: 65536               # DN/V
    fwc: 900000             # e
    fwc_serial: 1000000     # e
    vg: 1.6200e-10          # cm^2
    svg: 1.6200e-10         # cm^2
    t: 9.4722e-04           # s
    st: 9.4722e-04          # s

pipeline:
  class: pyxel.pipelines.ccd_pipeline.CCDDetectionPipeline

  # -> photons
  photon_generation:
#    - name: load_image
#      func: pyxel.models.photon_generation.load_image.load_image
#      enabled: false
#      arguments:
#        image_file: outputs/in.fits # data/01.fits
#        fit_image_to_det: false
#        convert_to_photons: true
#    - name: illumination
#      func: pyxel.models.photon_generation.illumination.illumination
#      enabled: false
#      arguments:
#          level: 1000

  # photons -> photons
  optics:

  # photons -> charges
  charge_generation:

#    - name: photoelectrons
#      func: pyxel.models.charge_generation.photoelectrons.simple_conversion
#      enabled: true

    - name: charge_injection
      func: pyxel.models.charge_generation.charge_injection.charge_blocks
      enabled: true
      arguments:
        charge_level: 10000
        columns: [30, 50, 70]
        number_of_transfers: 80
        number_of_blocks: 3
        block_start: 5
        block_length: 10
        pause_length: 20

  # charges -> pixels
  charge_collection:
    - name: simple_collection
      func: pyxel.models.charge_collection.collection.simple_collection
      enabled: true

  # pixels -> pixels
  charge_transfer:
    - name: cdm
      func: pyxel.models.charge_transfer.cdm.CDM.cdm
      enabled: false
      arguments:
       beta_p: 0.1
       beta_s: 0.3
       parallel_cti: true
       serial_cti: false
       chg_inj: true
       para_transfers: 1552
       tr_p: [0.01]
       tr_s: [0.01]
       nt_p: [1.]
       nt_s: [1.]
       sigma_p: [1.]
       sigma_s: [1.]

  # pixels -> signal
  charge_measurement:
    - name: simple_measurement
      func: pyxel.models.charge_measurement.measurement.simple_measurement
      enabled: true
#    - name: output_node_noise
#      func: pyxel.models.charge_measurement.readout_noise.output_node_noise
#      enabled: true
#      arguments:
#        std_deviation: 5.e-7   # Volt

  # signal -> image
  readout_electronics:
    - name: simple_amplifier
      func: pyxel.models.readout_electronics.amplification.simple_amplifier
      enabled: true
#    - name: simple_digitization
#      func: pyxel.models.readout_electronics.digitization.simple_digitization
#      enabled: false
#      arguments:
#        data_type: numpy.uint32
    - name: simple_digitization
      func: pyxel.models.readout_electronics.digitization.simple_processing
      enabled: true
