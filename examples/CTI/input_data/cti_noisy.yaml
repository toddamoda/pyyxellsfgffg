# ########################################################### #
# Pyxel detector simulation framework                         #
#                                                             #
# Example yaml configuration file                             #
# Calibrate CDM CTI model with target image                   #
# Created by D. Lucsanyi (ESA)                                #
# ########################################################### #

simulation:

  mode: single

  outputs:
    output_folder:  'examples/CTI/input_data'

ccd_detector:

  geometry:

    row:   100                  # pixel
    col:   100                  # pixel
    total_thickness: 40.        # um
    pixel_vert_size: 10.        # um
    pixel_horz_size: 10.        # um

  material:
    material: 'silicon'

  environment:
    temperature: 300        # K

  characteristics:
    qe: 0.5                 # -
    eta: 1.                 # e/photon
    sv: 1.0e-6              # V/e
    amp: 0.8                # V/V
    a1: 100.                # V/V
    a2: 65536               # DN/V
    fwc: 900000             # e
    fwc_serial: 1000000     # e
    vg: 1.6200e-10          # cm^2
    svg: 1.6200e-10         # cm^2
    t: 9.4722e-04           # s
    st: 9.4722e-04          # s

pipeline:

  # -> photon
  photon_generation:

  # photon -> photon
  optics:

  # photon -> charge
  charge_generation:

    - name: charge_injection
      func: pyxel.models.charge_generation.charge_injection.charge_blocks
      enabled: true
      arguments:
        charge_level: 100000
        block_start: 70
        block_end: 80

  # charge -> pixel
  charge_collection:
    - name: simple_collection
      func: pyxel.models.charge_collection.collection.simple_collection
      enabled: true

  # pixel -> pixel
  charge_transfer:
    - name: cdm
      func: pyxel.models.charge_transfer.cdm.cdm
      enabled: true
      arguments:
        parallel_cti: true
        serial_cti: true
        charge_injection: true
        beta_p: 0.4
        beta_s: 0.3
        tr_p: [5.e-3]
        tr_s: [2.e-3]
        nt_p: [100.]
        nt_s: [50.]
        sigma_p: [1.e-15]
        sigma_s: [1.e-13]

  # pixel -> signal
  charge_measurement:
    - name: simple_measurement
      func: pyxel.models.charge_measurement.measurement.simple_measurement
      enabled: true
    - name: output_node_noise
      func: pyxel.models.charge_measurement.readout_noise.output_node_noise
      enabled: true
      arguments:
        std_deviation: 5.e-5   # Volt

  # signal -> image
  readout_electronics:
    - name: simple_amplifier
      func: pyxel.models.readout_electronics.amplification.simple_amplifier
      enabled: true
    - name: simple_digitization
      func: pyxel.models.readout_electronics.digitization.simple_digitization
      enabled: true
      arguments:
        data_type: numpy.uint32
