# ########################################################### #
# Pyxel detector simulation framework                         #
#                                                             #
# Example yaml configuration file                             #
# Single run combining different detector effect models       #
# Created by D. Lucsanyi (ESA)                                #
# ########################################################### #

simulation:
  mode: single

  outputs:
    output_folder: 'examples/basic/output'

detector:
  class: pyxel.detectors.ccd.CCD

  geometry:
    class: pyxel.detectors.ccd_geometry.CCDGeometry

    row: 1488               # pixels
    col: 1485               # pixels
    total_thickness: 20.    # um
    pixel_vert_size: 10.    # um
    pixel_horz_size: 10.    # um

  material:
    class: pyxel.detectors.material.Material
    material: 'silicon'

  environment:
    class: pyxel.detectors.environment.Environment
    temperature: 300        # K

  characteristics:
    class: pyxel.detectors.ccd_characteristics.CCDCharacteristics
    qe:   1.                # -
    eta:  1.                # e/photon
    sv:   3.e-6             # V/e
    amp:  10.               # V/V
    a1:   100.              # V/V
    a2:   10000             # DN/V
    fwc:  1000              # e
    fwc_serial: 3000        # e
    vg:   1.62e-10          # cm^2
    svg:  1.62e-10          # cm^2
    t:    9.4722e-04        # s
    st:   9.4722e-04        # s

pipeline:
  class: pyxel.pipelines.ccd_pipeline.CCDDetectionPipeline

  # photons -> photons
  photon_generation:
    - name: load_image
      func: pyxel.models.photon_generation.load_image.load_image
      enabled: true
      arguments:
        image_file: 'examples/basic/Pleiades_HST.fits'
        convert_to_photons: true

    - name: shot_noise
      func: pyxel.models.photon_generation.shot_noise.shot_noise
      enabled: false

  # photons -> photons
  optics:
    - name: optical_psf
      func: pyxel.models.optics.poppy.optical_psf
      enabled: false
      arguments:
        fov_pixels: 30        # FOV in pixels
        pixelscale: 0.2       # micron/pixel OR arcsec/pixel
        wavelength: 2.e-6     # wavelength in microns
        optical_system:
          - item: CircularAperture
            radius: 1.
#          - item: ThinLens
#            radius: 0.8
#            nwaves: 1

    - name: alignment
      func: pyxel.models.optics.alignment.alignment
      enabled: true

  # photons -> charges
  charge_generation:
    - name: photoelectrons
      func: pyxel.models.charge_generation.photoelectrons.simple_conversion
      enabled: true

    - name: tars
      func: pyxel.models.charge_generation.tars.tars.run_tars
      enabled: true
      arguments:
        simulation_mode: cosmic_ray   # snowflakes
        running_mode: stepsize
        particle_type: proton
        initial_energy: 1000.   # MeV
        particle_number: 10
        incident_angles:        # rad
        starting_position:      # um
        spectrum_file: 'pyxel/models/charge_generation/tars/data/inputs/proton_L2_solarMax_11mm_Shielding.txt'
        random_seed: 1234

  # charges -> pixels
  charge_collection:
    - name: simple_collection
      func: pyxel.models.charge_collection.collection.simple_collection
      enabled: true

    - name: full_well
      func: pyxel.models.charge_collection.full_well.simple_full_well
      enabled: false

  # pixels -> pixels
  charge_transfer:
    - name: cdm
      func: pyxel.models.charge_transfer.cdm.CDM.cdm
      enabled: false
      arguments:
        parallel_cti: true
        serial_cti: false
        charge_injection: false
        beta_p: 0.3
        tr_p: [1.e-2]
        nt_p: [20.]
        sigma_p: [1.e-10]
        beta_s: 0.
        tr_s: []
        nt_s: []
        sigma_s: []

  # pixels -> signal
  charge_measurement:
    - name: simple_measurement
      func: pyxel.models.charge_measurement.measurement.simple_measurement
      enabled: true

  # signal -> image
  readout_electronics:
    - name: simple_amplifier
      func: pyxel.models.readout_electronics.amplification.simple_amplifier
      enabled: true
    - name: simple_digitization
      func: pyxel.models.readout_electronics.digitization.simple_processing
      enabled: true
