# ########################################################### #
# Pyxel detector simulation framework                         #
#                                                             #
# Example yaml configuration file                             #
# Calibrate CDM CTI model with target image                   #
# Created by D. Lucsanyi (ESA)                                #
# ########################################################### #

simulation:

  mode: calibration

  calibration:
    calibration_mode:     pipeline
    result_type:          image
    result_fit_range:     [0, 100, 0, 100]
    target_data_path:     ['examples/CTI/input_data/cti/data.fits']
    target_fit_range:     [0, 100, 0, 100]
    seed:                 20001
    fitness_function:
      func:               pyxel.calibration.fitness.sum_of_abs_residuals
      arguments:
    algorithm:
      type:               sade
      generations:        15
      population_size:    30
      variant:            2
    parameters:
      - key:              pipeline.charge_transfer.cdm.arguments.beta_p
        values:           _
        logarithmic:      false
        boundaries:       [0., 1.]

  outputs:
    output_folder:        'examples/CTI/output'
    output_format:
    calibration_plot:
      champions_plot:
      population_plot:

detector:
  class: pyxel.detectors.ccd.CCD

  geometry:
    class: pyxel.detectors.ccd_geometry.CCDGeometry

    row:   100                  # pixels
    col:   100                  # pixels
    total_thickness: 40.        # um
    pixel_vert_size: 10.        # um
    pixel_horz_size: 10.        # um

  material:
    class: pyxel.detectors.material.Material
    material: 'silicon'

  environment:
    class: pyxel.detectors.environment.Environment
    temperature: 300        # K

  characteristics:
    class: pyxel.detectors.ccd_characteristics.CCDCharacteristics
    qe: 0.5                 # -
    eta: 1.                 # e/photon
    sv: 1.0e-6              # V/e
    amp: 0.8                # V/V
    a1: 100.                # V/V
    a2: 65536               # DN/V
    fwc: 900000             # e
    fwc_serial: 1000000     # e
    vg: 1.6200e-10          # cm^2
    svg: 1.6200e-10         # cm^2
    t: 9.4722e-04           # s
    st: 9.4722e-04          # s

pipeline:
  class: pyxel.pipelines.ccd_pipeline.CCDDetectionPipeline

  # -> photons
  photon_generation:

  # photons -> photons
  optics:

  # photons -> charges
  charge_generation:
    - name: charge_injection
      func: pyxel.models.charge_generation.charge_injection.charge_blocks
      enabled: true
      arguments:
        charge_level: 100000
        columns: [20, 50, 80]
        profile_length: 90
        number_of_blocks: 3
        block_length: 10
        pause_length: 20

  # charges -> pixels
  charge_collection:
    - name: simple_collection
      func: pyxel.models.charge_collection.collection.simple_collection
      enabled: true

  # pixels -> pixels
  charge_transfer:
    - name: cdm
      func: pyxel.models.charge_transfer.cdm.cdm
      enabled: true
      arguments:
        parallel_cti: true
        serial_cti: true
        charge_injection: true
        beta_p: 0.                    # calibrating this parameter
        beta_s: 0.3
        tr_p: [5.e-3]
        tr_s: [2.e-3]
        nt_p: [100.]
        nt_s: [50.]
        sigma_p: [1.e-15]
        sigma_s: [1.e-15]

  # pixels -> signal
  charge_measurement:
    - name: simple_measurement
      func: pyxel.models.charge_measurement.measurement.simple_measurement
      enabled: true

  # signal -> image
  readout_electronics:
    - name: simple_amplifier
      func: pyxel.models.readout_electronics.amplification.simple_amplifier
      enabled: true
    - name: simple_digitization
      func: pyxel.models.readout_electronics.digitization.simple_processing
      enabled: true
