# ########################################################### #
# Pyxel detector simulation framework                         #
#                                                             #
# Example YAML configuration file                             #
# Exposure mode combining different detector effect models    #                         
# ########################################################### #


exposure:

  readout:
    times: [1.0]
    non_destructive:  false

  outputs:
    output_folder: "output"
    save_data_to_file:
      - detector.image.array:   ['fits']
      - detector.pixel.array: ['npy']
    #save_exposure_data:
      #- dataset: ['nc']
      
ccd_detector:

  geometry:

    row: 1024               # pixel
    col: 1024               # pixel
    total_thickness: 20.    # um
    pixel_vert_size: 13.    # um
    pixel_horz_size: 13.    # um

  environment:
    temperature: 183        # K

  characteristics:
    quantum_efficiency: 0.7                 # -
    charge_to_volt_conversion: 1.4e-6      # V/e
    pre_amplification: 1                # V/V
    adc_voltage_range: [0., 0.1]
    adc_bit_resolution: 16
    full_well_capacity: 80000               # e

pipeline:
  # -> photon
  photon_collection:
    - name: load_image
      func: pyxel.models.photon_collection.load_image
      enabled: true
      arguments:
        image_file: 
        convert_to_photons: true
        multiplier: 1.0
        time_scale: 1.0
        bit_resolution: 16
        align: "center"


  # photon -> charge
  charge_generation:
    - name: photoelectrons
      func: pyxel.models.charge_generation.simple_conversion
      enabled: true
      
    - name: cosmix
      func: pyxel.models.charge_generation.cosmix
      enabled: true
      arguments:
        simulation_mode: cosmic_ray
        running_mode: stepsize
        particle_type: proton
        initial_energy: .001          # MeV
        particles_per_second: 1
        incident_angles: [0,0]
        spectrum_file: proton_L2_solarMax_11mm_Shielding.txt
        progressbar: false

    - name: simple_dark_current
      func: pyxel.models.charge_generation.simple_dark_current
      enabled: true
      arguments:
        dark_rate: 0.0004

  # charge -> pixel
  charge_collection:
    - name: simple_collection
      func: pyxel.models.charge_collection.simple_collection
      enabled: true

    - name: full_well
      func: pyxel.models.charge_collection.simple_full_well
      enabled: true

  # pixel -> pixel
  charge_transfer:
    - name: cdm
      func: pyxel.models.charge_transfer.cdm
      enabled: true
      arguments:
        direction: serial
        trap_release_times: [0.1,0.5]
        trap_densities: [30,15]
        sigma: [1.e-15 , 1e-15]
        beta: 0.5
        max_electron_volume: 1.0e-10   
        transfer_period: 1.0e-03

    - name: EMCCD_poisson_cic
      func: pyxel.models.charge_transfer.EMCCD_poisson_cic
      enabled: true
      arguments:
        total_gain: 500
        gain_elements: 604
        pcic_rate: 0.01
        scic_rate: 0.0002

  # pixel -> signal
  charge_measurement:
    - name: simple_measurement
      func: pyxel.models.charge_measurement.simple_measurement
      enabled: true

    - name: output_noise
      func: pyxel.models.charge_measurement.readout_noise.output_node_noise
      enabled: true
      arguments:
        std_deviation: 0.0000084

    - name: dc_offset
      func: pyxel.models.charge_measurement.dc_offset
      enabled: true
      arguments:
        offset: 0.002
        
  # signal -> image
  readout_electronics:
    - name: simple_amplifier
      func: pyxel.models.readout_electronics.simple_amplifier
      enabled: true
    - name: simple_adc
      func: pyxel.models.readout_electronics.simple_adc
      enabled: true
