ccd_detector:
  geometry:
    row: 10
    col: 10
    total_thickness: 40.0
    pixel_vert_size: 18.0
    pixel_horz_size: 18.0
    pixel_scale: 0.01
  environment:
    temperature: 173.0
  characteristics:
    quantum_efficiency: 0.8
    charge_to_volt:
      value: !!float 1e-6 # ✅ Force YAML to parse as float (not string)
    pre_amplification: 100.0
    full_well_capacity: 100000
    adc_bit_resolution: 16
    adc_voltage_range: [0.0, 10.0]

pipeline:
  photon_collection:
    # Initialize photon array with a simple illumination model
    - name: illumination
      func: pyxel.models.photon_collection.illumination
      enabled: true
      arguments:
        level: 500
        object_center: [5, 5]
        object_size: [5, 5]
        option: "elliptic"

    # Apply modulation and visualize
    - name: photon_flux_modulation
      func: pyxel.models.photon_collection.photon_modulation.photon_flux_modulation
      enabled: true
      arguments:
        modulation_type: sin
        amplitude: 0.5
        frequency: 2.0
        debug: true

  charge_collection:
    - name: simple_collection
      func: pyxel.models.charge_collection.simple_collection
      enabled: true
