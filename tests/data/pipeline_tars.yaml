# PyXel! settings

ccd_process: !PROCESSOR
  detector: !CCD

    geometry: !ccd_geometry
      row: 100                      # compulsory
      col: 100                      # compulsory
      depletion_thickness: 10.0     # um
      field_free_thickness: 0.0     # um
      pixel_vert_size: 10.0         # um
      pixel_horz_size: 10.0         # um
      total_thickness: 10.0         # um

    material: !material

    environment: !environment
      temperature: 320  # detector temperature Kelvin

    characteristics: !ccd_characteristics
      qe: 0.5         # -
      eta: 1          # e/photon
      sv:  1.0e-6      # V/e
      amp: 0.8       # V/V
      a1: 100         # V/V
      a2: 65536       # DN/V


  pipeline: !CCD_PIPELINE

    # -> photons
    photon_generation: !models
      load_image: !model
        name: pyxel.models.photon_generation.load_image
        enabled: true
        arguments:
          image_file: data/HorseHead_orig.fits

      photon_level: !model
        name: pyxel.models.photon_generation.add_photon_level
        enabled: false
        arguments:
          level: 0

      shot_noise:
        name: pyxel.models.photon_generation.add_shot_noise

    # photons -> photons
    optics: !models

    # photons -> charge
    charge_generation: !models

      photoelectrons: !model
        name: pyxel.models.photoelectrons.simple_conversion

      tars: !model
        name: pyxel.models.tars.tars.run_tars
        enabled: true
        arguments:
          particle_type: proton
          initial_energy: 100.   # MeV
          particle_number: 1
          incident_angles:      # rad
            - 0.31416
            - 0.7853
          starting_position:    # um
            - 500.0
            - 500.0
            - 0.0
#          stepping_length: 1.0  # um
          spectrum_file: 'pyxel/models/tars/data/inputs/proton_L2_solarMax_11mm_Shielding.txt'
          let_file: 'pyxel/models/tars/data/inputs/let_proton_1GeV_100um_geant4_HighResHist.ascii'

    # charge -> charge
    charge_collection: !models

    # charge -> charge
    charge_transfer: !models

    # charge -> signal
    charge_measurement: !models
      readout_noise: !model
        name: pyxel.models.ccd_noise.add_output_node_noise
        arguments:
          std_deviation: 1.0

    # signal -> image
    readout_electronics: !models
