################
# Pyxel configuration file for testing model calibration mode
################

simulation:
###################
  mode: calibration
###################

  calibration:
    calibration_mode:  pipeline
    output_type: image
    output_fit_range: [2, 5]

    target_data_path: ['tests/data/cti-data.txt']   # not used
    target_fit_range: [1, 4]
    weighting_path: ['tests/data/cti-data.txt']

    fitness_function:
      func: pyxel.calibration.fitness.sum_of_abs_residuals
      arguments:

    algorithm:
      type: sade
      generations: 2
      population_size: 2
      variant: 2

    steps:
      - key:  detector.characteristics.amp
        values: _
        logarithmic: false
        boundaries: [1., 10.]
      - key:  pipeline.charge_transfer.cdm.arguments.tr_p
        values: [_, _]
        logarithmic: true
        boundaries: [1.e-3, 2.]
      - key:  pipeline.charge_transfer.cdm.arguments.nt_p
        values: [_, _]
        logarithmic: true
        boundaries: [1.e-2, 1.e+1]
      - key:  pipeline.charge_transfer.cdm.arguments.beta_p
        values: _
        logarithmic: false
        boundaries: [0., 1.]
      - key:  pipeline.charge_measurement.cdm.arguments.std_deviation
        values: _
        logarithmic: false
        boundaries: [10., 200.]

detector:
  class: pyxel.detectors.ccd.CCD

  geometry:
    class: pyxel.detectors.ccd_geometry.CCDGeometry

  material:
    class: pyxel.detectors.material.Material

  environment:
    class: pyxel.detectors.environment.Environment

  characteristics:
    class: pyxel.detectors.ccd_characteristics.CCDCharacteristics

pipeline:
  class: pyxel.pipelines.ccd_pipeline.CCDDetectionPipeline

  # -> photons
  photon_generation:

  # photons -> photons
  optics:

  # photons -> charge
  charge_generation:

  # charge -> charge
  charge_transfer:

  # charge -> signal
  charge_measurement:

  # signal -> image
  readout_electronics: