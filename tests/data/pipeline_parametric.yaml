
simulation:
  mode: single

  parametric:
    parametric_mode: sequential
    parameters:
      -
        enabled: true
        key: pipeline.photon_generation.photon_level.arguments.level
        values: [10, 20, 30]
      -
        enabled: true
        key: pipeline.charge_generation.tars.arguments.initial_energy
        values: [100, 200, 300]
      -
        enabled: false
        key:
        values:
      -
        enabled: false
        key:
        values:

  calibration:
    calibration_mode:  pipeline
    output_type: image
    output_fit_range: [2, 5]
    target_data_path: ['tests/data/cti-data.txt']   # not used
    target_fit_range: [1, 4]
    fitness_function:
      func: pyxel.calibration.fitness.sum_of_abs_residuals
      arguments:
    algorithm:
      type: sade
      generations: 2
      population_size: 2
      variant: 2
    parameters:
      - key:
        values:

detector:
  class: pyxel.detectors.ccd.CCD

  geometry:
    class: pyxel.detectors.ccd_geometry.CCDGeometry
    row: 100                      # compulsory
    col: 100                      # compulsory
    total_thickness: 10.0         # um
    pixel_vert_size: 10.0         # um
    pixel_horz_size: 10.0         # um

  material:
    class: pyxel.detectors.material.Material
    material: 'silicon'
    n_acceptor: 0.0               # cm-3
    n_donor: 0.0                  # cm-3

  environment:
    class: pyxel.detectors.environment.Environment
    temperature: 300                    # Kelvin, detector temperature
    total_ionising_dose: 8.0e11         # total ionising dose (IEL)
    total_non_ionising_dose: 8.0e11     # total non-ionising dose (NIEL)

  characteristics:
    class: pyxel.detectors.ccd_characteristics.CCDCharacteristics
    qe: 0.5               # -
    eta: 1                # e/photon
    sv: 1.0e-6            # V/e
    amp: 0.8             # V/V
    a1: 100               # V/V
    a2: 65536             # DN/V
    fwc: 20000            # e
    fwc_serial: 30000     # e

pipeline:
  class: pyxel.pipelines.ccd_pipeline.CCDDetectionPipeline

  photon_generation:
    -
      name: load_image
      func: pyxel.models.photon_generation.load_image.load_image
      enabled: false
      arguments:
        image_file: null
        convert_to_photons: true
    -
      name: photon_level
      func: pyxel.models.photon_generation.illumination.illumination
      enabled: true
      arguments:
        level: 100
    -
      name: shot_noise
      func: pyxel.models.photon_generation.shot_noise.shot_noise
      enabled: true

  # -> photons
  optics:

  # -> charge
  charge_generation:
    -
      name: photoelectrons
      enabled: false
      func: pyxel.models.charge_generation.photoelectrons.simple_conversion
    -
      name: tars
      func: pyxel.models.charge_generation.tars.tars.run_tars
      enabled: true
      arguments:
        simulation_mode: cosmic_ray   # snowflakes
        running_mode: stepsize  # stopping  # plotting  # geant4
        particle_type: proton
        initial_energy: 100.   # MeV
        particle_number: 1
        incident_angles:      # rad
        starting_position:    # um
        spectrum_file: 'pyxel/models/charge_generation/tars/data/inputs/proton_L2_solarMax_11mm_Shielding.txt'


  # -> charge
  charge_collection:
    -
      name: fixed_pattern_noise
      enabled: false
      func: pyxel.models.charge_collection.fix_pattern_noise.fix_pattern_noise
      arguments:
        pix_non_uniformity: data/non_uniformity_array_normal_random_dist.data
    -
      name: full_well
      func: pyxel.models.charge_collection.full_well.simple_pixel_full_well
      enabled: false

  # -> charge
  charge_transfer:
    -
      name: cdm
      enabled: false
      func: pyxel.models.charge_transfer.cdm.CDM.cdm
      arguments:
       beta_p: 0.6
       beta_s: 0.6
       vg: 6.e-11
       svg: 1.0e-10
       t: 20.48e-3
       st: 5.0e-6
       parallel_trap_file: pyxel/models/cdm/cdm_euclid_parallel.dat
       serial_trap_file: pyxel/models/cdm/cdm_euclid_serial.dat

  # -> signal
  charge_measurement:
    -
      name: output_node_noise
      enabled: false
      func: pyxel.models.charge_measurement.readout_noise.output_node_noise
      arguments:
        std_deviation: 1.0

  # -> signal
  readout_electronics:
